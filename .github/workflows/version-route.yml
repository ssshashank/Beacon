name: Route v2 Features to _v0.2.0

on:
  push:
    branches:
      - 'feat:/v2-*'
      - 'fix:/v2-*'

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-route:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Target Version Branch
        id: target
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          # Example: feat/v2-stats-stream -> v2
          TARGET_BRANCH=$(echo "$BRANCH" | sed -E 's#^(feat|fix)/(v[0-9]+)-.*#\2#')
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "target=$TARGET_BRANCH" >> $GITHUB_OUTPUT
          echo "Target branch detected: $TARGET_BRANCH"
      - name: Verify Target Branch Exists
        run: |
          if ! git show-ref --verify --quiet "refs/remotes/origin/${{ steps.target.outputs.target }}"; then
            echo "Error: Target branch '${{ steps.target.outputs.target }}' does not exist!"
            exit 1
          fi

      - name: Run Rust Checks & Tests
        run: |
          cargo check --all-targets
          cargo test

      - name: Create & Auto-Merge PR to Target Version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SOURCE="${{ steps.target.outputs.branch }}"
          TARGET="${{ steps.target.outputs.target }}"

          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head "$SOURCE" --base "$TARGET" --json number -q '.[0].number')

          if [ -z "$EXISTING_PR" ]; then
            PR_URL=$(gh pr create \
              --base "$TARGET" \
              --head "$SOURCE" \
              --title "chore($TARGET): merge $SOURCE" \
              --body "Automated merge after CI checks passed.")
            gh pr merge "$PR_URL" --squash --delete-branch
          else
            gh pr merge "$EXISTING_PR" --squash --delete-branch
          fi
