<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="listCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="itemRowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0f1118" />
    </linearGradient>
    <linearGradient id="activeRowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12252a" />
      <stop offset="100%" stop-color="#0c181d" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Background: #0A0A0B -->
  <rect width="512" height="512" fill="#0A0A0B" />

  <!-- Background Tech Grid Lines -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1.5">
    <line x1="96" y1="32" x2="96" y2="480" stroke-dasharray="6,6" />
    <line x1="256" y1="32" x2="256" y2="480" stroke-dasharray="6,6" />
    <line x1="416" y1="32" x2="416" y2="480" stroke-dasharray="6,6" />
    <line x1="32" y1="128" x2="480" y2="128" stroke-dasharray="6,6" />
    <line x1="32" y1="256" x2="480" y2="256" stroke-dasharray="6,6" />
    <line x1="32" y1="384" x2="480" y2="384" stroke-dasharray="6,6" />
  </g>

  <!-- CONTAINER LIST / MENU ICON GROUP -->
  <g id="container-list-structure" transform="translate(48, 56)">
    
    <!-- Outer List Panel / Terminal Frame -->
    <rect x="16" y="16" width="384" height="368" rx="20" fill="#0d0e14" stroke="#1e2436" stroke-width="2.5" />
    
    <!-- Top Terminal / Table Header Bar -->
    <path d="M16 36 C16 25 25 16 36 16 L380 16 C391 16 400 25 400 36 L400 68 L16 68 Z" fill="#131722" />
    <line x1="16" y1="68" x2="400" y2="68" stroke="#1f273d" stroke-width="2" />
    
    <!-- Header Window Dots -->
    <circle cx="42" cy="42" r="4.5" fill="#ef4444" opacity="0.75" />
    <circle cx="58" cy="42" r="4.5" fill="#f59e0b" opacity="0.75" />
    <circle cx="74" cy="42" r="4.5" fill="#10b981" opacity="0.75" />

    <!-- Header Title / Tag (CONTAINERS) -->
    <text x="100" y="47" 
          font-family="system-ui, -apple-system, 'SF Pro Display', monospace" 
          font-size="12" 
          font-weight="700" 
          letter-spacing="2" 
          fill="#64748b">CONTAINER LIST</text>

    <!-- Header Counter / Badge (3 ACTIVE) -->
    <rect x="312" y="32" width="72" height="20" rx="10" fill="#182c2b" stroke="#0ea5e9" stroke-width="1.2" />
    <circle cx="323" cy="42" r="3" fill="#38bdf8" filter="url(#cyanGlow)" />
    <text x="353" y="46" 
          font-family="system-ui, -apple-system, monospace" 
          font-size="10" 
          font-weight="800" 
          letter-spacing="1" 
          fill="#38bdf8" 
          text-anchor="middle">ACTIVE</text>

    <!-- ================= ROW 1 (Highlighted / Active Container) ================= -->
    <g transform="translate(36, 88)">
      <!-- Row Background -->
      <rect x="0" y="0" width="344" height="76" rx="12" fill="url(#activeRowGrad)" stroke="#0284c7" stroke-width="2" />
      
      <!-- Mini 3D Isometric Container Cube Icon -->
      <g transform="translate(36, 38)">
        <!-- Top Face -->
        <polygon points="0,-16 18,-6 0,4 -18,-6" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round" />
        <!-- Left Face -->
        <polygon points="-18,-6 0,4 0,22 -18,12" fill="#082f49" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round" />
        <!-- Right Face -->
        <polygon points="0,4 18,-6 18,12 0,22" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round" />
        <!-- Container Ribs -->
        <line x1="-9" y1="-1" x2="-9" y2="17" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
        <line x1="9" y1="-1" x2="9" y2="17" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
        <!-- Glowing Node Indicator -->
        <circle cx="0" cy="4" r="2.5" fill="#ffffff" filter="url(#cyanGlow)" />
      </g>

      <!-- Container Info Lines (List items) -->
      <!-- Name / Label -->
      <rect x="72" y="20" width="108" height="10" rx="4" fill="#38bdf8" filter="url(#cyanGlow)" opacity="0.95" />
      <!-- Image / Tag hash -->
      <rect x="72" y="38" width="148" height="7" rx="3" fill="#64748b" />
      <rect x="72" y="51" width="70" height="6" rx="3" fill="#334155" />

      <!-- Status Indicator Pill on Right -->
      <g transform="translate(254, 26)">
        <rect x="0" y="0" width="74" height="24" rx="12" fill="#0b291b" stroke="#22c55e" stroke-width="1.2" />
        <circle cx="14" cy="12" r="3.5" fill="#22c55e" />
        <text x="43" y="16" 
              font-family="system-ui, monospace" 
              font-size="10" 
              font-weight="800" 
              letter-spacing="1" 
              fill="#4ade80" 
              text-anchor="middle">UP</text>
      </g>
    </g>

    <!-- ================= ROW 2 (Second Container) ================= -->
    <g transform="translate(36, 180)">
      <!-- Row Background -->
      <rect x="0" y="0" width="344" height="76" rx="12" fill="url(#itemRowGrad)" stroke="#1e2438" stroke-width="1.5" />
      
      <!-- Mini 3D Isometric Container Cube Icon -->
      <g transform="translate(36, 38)">
        <!-- Top Face -->
        <polygon points="0,-16 18,-6 0,4 -18,-6" fill="#1e293b" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round" />
        <!-- Left Face -->
        <polygon points="-18,-6 0,4 0,22 -18,12" fill="#0f172a" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round" />
        <!-- Right Face -->
        <polygon points="0,4 18,-6 18,12 0,22" fill="#141e33" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round" />
        <!-- Container Ribs -->
        <line x1="-9" y1="-1" x2="-9" y2="17" stroke="#475569" stroke-width="1" />
        <line x1="9" y1="-1" x2="9" y2="17" stroke="#475569" stroke-width="1" />
      </g>

      <!-- Container Info Lines -->
      <rect x="72" y="20" width="92" height="10" rx="4" fill="#cbd5e1" opacity="0.85" />
      <rect x="72" y="38" width="135" height="7" rx="3" fill="#475569" />
      <rect x="72" y="51" width="60" height="6" rx="3" fill="#334155" />

      <!-- Status Indicator Pill on Right -->
      <g transform="translate(254, 26)">
        <rect x="0" y="0" width="74" height="24" rx="12" fill="#0b291b" stroke="#22c55e" stroke-width="1.2" />
        <circle cx="14" cy="12" r="3.5" fill="#22c55e" />
        <text x="43" y="16" 
              font-family="system-ui, monospace" 
              font-size="10" 
              font-weight="800" 
              letter-spacing="1" 
              fill="#4ade80" 
              text-anchor="middle">UP</text>
      </g>
    </g>

    <!-- ================= ROW 3 (Third Container) ================= -->
    <g transform="translate(36, 272)">
      <!-- Row Background -->
      <rect x="0" y="0" width="344" height="76" rx="12" fill="url(#itemRowGrad)" stroke="#1e2438" stroke-width="1.5" />
      
      <!-- Mini 3D Isometric Container Cube Icon -->
      <g transform="translate(36, 38)">
        <!-- Top Face -->
        <polygon points="0,-16 18,-6 0,4 -18,-6" fill="#1e293b" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round" />
        <!-- Left Face -->
        <polygon points="-18,-6 0,4 0,22 -18,12" fill="#0f172a" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round" />
        <!-- Right Face -->
        <polygon points="0,4 18,-6 18,12 0,22" fill="#141e33" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round" />
        <!-- Container Ribs -->
        <line x1="-9" y1="-1" x2="-9" y2="17" stroke="#475569" stroke-width="1" />
        <line x1="9" y1="-1" x2="9" y2="17" stroke="#475569" stroke-width="1" />
      </g>

      <!-- Container Info Lines -->
      <rect x="72" y="20" width="118" height="10" rx="4" fill="#94a3b8" opacity="0.8" />
      <rect x="72" y="38" width="125" height="7" rx="3" fill="#475569" />
      <rect x="72" y="51" width="80" height="6" rx="3" fill="#334155" />

      <!-- Status Indicator Pill on Right -->
      <g transform="translate(254, 26)">
        <rect x="0" y="0" width="74" height="24" rx="12" fill="#1b1c24" stroke="#475569" stroke-width="1.2" />
        <circle cx="14" cy="12" r="3.5" fill="#94a3b8" />
        <text x="43" y="16" 
              font-family="system-ui, monospace" 
              font-size="9" 
              font-weight="800" 
              letter-spacing="1" 
              fill="#94a3b8" 
              text-anchor="middle">EXITED</text>
      </g>
    </g>

    <!-- Connecting Left Indicator Rail / Hierarchy Line -->
    <line x1="26" y1="126" x2="26" y2="310" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="4,4" opacity="0.4" />

  </g>
</svg>
