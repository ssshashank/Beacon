<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Neon green / emerald live status gradients -->
    <linearGradient id="activeBeamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="activeBoxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152e22" />
      <stop offset="100%" stop-color="#0c1e16" />
    </linearGradient>
    <linearGradient id="activeBoxFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11241a" />
      <stop offset="100%" stop-color="#09130e" />
    </linearGradient>
    <linearGradient id="activeBoxSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#162e21" />
      <stop offset="100%" stop-color="#0d1b14" />
    </linearGradient>
    <!-- Glowing filters -->
    <filter id="greenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="strongGreenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>
  </defs>

  <!-- Solid Background: #0A0A0B -->
  <rect width="512" height="512" fill="#0A0A0B" />

  <!-- Background Subtle Grid with Neon Green Accents -->
  <g opacity="0.06" stroke="#22c55e" stroke-width="1.5">
    <line x1="96" y1="32" x2="96" y2="480" stroke-dasharray="6,6" />
    <line x1="256" y1="32" x2="256" y2="480" stroke-dasharray="6,6" />
    <line x1="416" y1="32" x2="416" y2="480" stroke-dasharray="6,6" />
    <line x1="32" y1="128" x2="480" y2="128" stroke-dasharray="6,6" />
    <line x1="32" y1="256" x2="480" y2="256" stroke-dasharray="6,6" />
    <line x1="32" y1="384" x2="480" y2="384" stroke-dasharray="6,6" />
  </g>

  <!-- RUNNING / ACTIVE CONTAINER GROUP -->
  <g id="running-container-group" transform="translate(0, 10)">

    <!-- Active Pulse Rings / Heartbeat Radar Waves behind container -->
    <g fill="none" stroke="#22c55e" opacity="0.3" stroke-width="2">
      <ellipse cx="256" cy="270" rx="190" ry="110" stroke-dasharray="10 12" />
      <ellipse cx="256" cy="270" rx="145" ry="85" stroke-dasharray="6 10" opacity="0.6" />
      <ellipse cx="256" cy="270" rx="95" ry="55" filter="url(#greenGlow)" opacity="0.8" />
    </g>

    <!-- Active Container (3D Isometric Shipping/Docker Container) -->
    <g id="active-box">
      <!-- Top Face -->
      <polygon points="256,135 390,205 256,275 122,205" fill="url(#activeBoxTop)" stroke="#22c55e" stroke-width="3.5" stroke-linejoin="round" />
      
      <!-- Top Corrugated Ridges -->
      <line x1="168" y1="181" x2="302" y2="251" stroke="#22c55e" stroke-width="2" opacity="0.6" />
      <line x1="212" y1="158" x2="346" y2="228" stroke="#22c55e" stroke-width="2" opacity="0.6" />

      <!-- Left Front Face -->
      <polygon points="122,205 256,275 256,365 122,295" fill="url(#activeBoxFront)" stroke="#22c55e" stroke-width="3.5" stroke-linejoin="round" />
      <!-- Container Door / Ribs -->
      <line x1="156" y1="223" x2="156" y2="313" stroke="#1c4730" stroke-width="3" />
      <line x1="190" y1="240" x2="190" y2="330" stroke="#1c4730" stroke-width="3" />
      <line x1="224" y1="258" x2="224" y2="348" stroke="#1c4730" stroke-width="3" />

      <!-- Right Face -->
      <polygon points="256,275 390,205 390,295 256,365" fill="url(#activeBoxSide)" stroke="#22c55e" stroke-width="3.5" stroke-linejoin="round" />
      <!-- Container Side Ribs -->
      <line x1="290" y1="258" x2="290" y2="348" stroke="#1c4730" stroke-width="3" />
      <line x1="324" y1="240" x2="324" y2="330" stroke="#1c4730" stroke-width="3" />
      <line x1="358" y1="223" x2="358" y2="313" stroke="#1c4730" stroke-width="3" />

      <!-- High-Intensity Corner Castings (Lock blocks) -->
      <rect x="116" y="200" width="12" height="14" rx="2" fill="#22c55e" filter="url(#greenGlow)" />
      <rect x="250" y="270" width="12" height="14" rx="2" fill="#4ade80" filter="url(#greenGlow)" />
      <rect x="384" y="200" width="12" height="14" rx="2" fill="#22c55e" filter="url(#greenGlow)" />
      <rect x="250" y="358" width="12" height="14" rx="2" fill="#16a34a" />
      <rect x="116" y="288" width="12" height="14" rx="2" fill="#16a34a" />
      <rect x="384" y="288" width="12" height="14" rx="2" fill="#16a34a" />

      <!-- Live Heartbeat / Activity Pulse Waveform inside Container Core -->
      <path d="M165 290 L188 290 L198 270 L208 310 L218 285 L228 295 L242 295" 
            fill="none" 
            stroke="#4ade80" 
            stroke-width="3" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            filter="url(#greenGlow)" />
    </g>

    <!-- RUNNING STATUS PILL / LIVE BADGE ON TOP -->
    <g id="status-live-badge" transform="translate(196, 75)">
      <!-- Badge Pill Container -->
      <rect x="0" y="0" width="120" height="34" rx="17" fill="#0d2417" stroke="#22c55e" stroke-width="2" />
      
      <!-- Glowing Active Green Dot with Ping Wave -->
      <circle cx="24" cy="17" r="9" fill="#22c55e" opacity="0.3" filter="url(#strongGreenGlow)" />
      <circle cx="24" cy="17" r="5" fill="#4ade80" filter="url(#greenGlow)" />
      <circle cx="24" cy="17" r="2.5" fill="#ffffff" />

      <!-- RUNNING / ACTIVE Text -->
      <text x="70" y="22" 
            font-family="system-ui, -apple-system, 'SF Pro Text', 'Inter', monospace" 
            font-size="12" 
            font-weight="800" 
            letter-spacing="2" 
            fill="#4ade80" 
            text-anchor="middle">RUNNING</text>
    </g>

    <!-- Activity Signal Sparks / Telemetry Dots -->
    <circle cx="256" cy="118" r="3.5" fill="#4ade80" filter="url(#greenGlow)" />
    <line x1="256" y1="109" x2="256" y2="135" stroke="#22c55e" stroke-width="2" stroke-dasharray="3,3" opacity="0.8" />
    <circle cx="110" cy="190" r="3" fill="#22c55e" opacity="0.7" />
    <circle cx="402" cy="190" r="3" fill="#22c55e" opacity="0.7" />

  </g>
</svg>
